/* ===== Responsive base ===== */
html, body { margin:0; padding:0; overflow:hidden; overscroll-behavior:none; }
* { -webkit-tap-highlight-color: transparent; }
/* Default portrait touch controls */
.touch-controls-1p { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
/* Phone portrait (<= 430px) - keep original but ensure not overflow */
@media (max-width: 430px) and (orientation: portrait) {
  .touch-controls-1p { height: 128px !important; gap:6px !important; padding:6px !important; padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important; }
  .touch-controls-1p .touch-btn-1p-main { border-radius: 18px !important; }
}
/* Small phone like SE */
@media (max-width: 375px) {
  .touch-controls-1p { height: 118px !important; }
}
/* Galaxy Fold, narrow */
@media (max-width: 320px) {
  .touch-controls-1p { height: 106px !important; gap:4px !important; }
  .touch-controls-1p .touch-btn-1p-main span:first-child { font-size: 16px !important; }
}
/* ===== iPhone landscape fix - THE BUG =====
   iPhone landscape = width > height and height <= 500 (includes 14,15, SE landscape, 12 mini etc)
   Previously buttons were 150px tall and huge. Now compact to 52-60px.
*/
@media (orientation: landscape) and (max-height: 500px) {
  .touch-controls-1p {
    height: 54px !important;
    min-height: 54px !important;
    max-height: 60px !important;
    gap: 6px !important;
    padding: 3px 8px !important;
    padding-bottom: calc(3px + env(safe-area-inset-bottom)) !important;
    background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0.05)) !important;
    align-items: center !important;
    justify-content: center !important;
    opacity: 0.96;
    backdrop-filter: blur(6px);
  }
  .touch-controls-1p .touch-btn-1p-main {
    width: auto !important;
    min-width: 44px !important;
    max-width: 120px !important;
    height: 42px !important;
    min-height: 42px !important;
    max-height: 44px !important;
    flex: 1 1 88px !important;
    border-radius: 11px !important;
    font-size: 0.65em !important;
    padding: 0 6px !important;
    border-width: 1.2px !important;
    box-shadow: 0 0 12px rgba(0,240,255,0.18) !important;
  }
  .touch-controls-1p .touch-btn-1p-main span:first-child { font-size: 10px !important; letter-spacing: 0.04em !important; line-height:1 !important; }
  .touch-controls-1p .touch-btn-1p-main span:last-child { font-size: 7px !important; margin-top: 0px !important; line-height:1 !important; opacity:0.6 !important; }
  .touch-controls-1p .touch-btn-1p-emergency-wrap { width: 48px !important; gap: 1px !important; flex: 0 0 48px !important; }
  .touch-controls-1p .touch-btn-1p-emergency {
    width: 40px !important;
    height: 40px !important;
    min-width: 40px !important;
    min-height: 40px !important;
    border-radius: 10px !important;
    box-shadow: 0 0 10px rgba(255,230,0,0.22) !important;
  }
  .touch-controls-1p .touch-btn-1p-emergency span:first-child { font-size: 7.5px !important; line-height:1 !important; }
  .touch-controls-1p .touch-btn-1p-emergency span:last-child { font-size: 6.5px !important; }
  .touch-controls-2p-vert-top, .touch-controls-2p-vert-bottom { display:none !important; }
  .touch-controls-2p-landscape { top: 32px !important; bottom: 48px !important; }
  .touch-controls-2p-landscape-side { width: 62px !important; gap: 3px !important; padding: 2px 3px !important; }
  .touch-controls-2p-landscape-side .touch-btn-2p-landscape {
    min-height: 36px !important;
    height: 38px !important;
    max-height: 40px !important;
    width: 100% !important;
    border-radius: 10px !important;
    font-size: 0.6em !important;
    border-width: 1.2px !important;
    padding: 0 !important;
  }
  .touch-controls-2p-landscape-side .touch-btn-2p-landscape span:first-child { font-size: 10px !important; line-height:1 !important; }
  .touch-controls-2p-landscape-side .touch-btn-2p-landscape span:last-child { font-size: 7px !important; }
  .touch-controls-2p-landscape-side .touch-btn-2p-landscape-emergency {
    height: 30px !important;
    min-height: 30px !important;
    max-height: 32px !important;
    border-radius: 8px !important;
    font-size: 0.55em !important;
  }
}
/* iPhone 14 Pro Max / 15 Pro Max landscape - slightly taller but still compact */
@media (orientation: landscape) and (min-height: 430px) and (max-height: 500px) and (min-width: 800px) {
  .touch-controls-1p { height: 58px !important; }
  .touch-controls-1p .touch-btn-1p-main { height: 46px !important; min-height:46px !important; }
}
/* JS fallback class .landscape-compact - same as above, for iOS where media query lags */
body.landscape-compact .touch-controls-1p {
  height: 54px !important;
  min-height: 54px !important;
  gap: 6px !important;
  padding: 3px 8px !important;
  padding-bottom: calc(3px + env(safe-area-inset-bottom)) !important;
  background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0.05)) !important;
  align-items: center !important;
  opacity: 0.96;
}
body.landscape-compact .touch-controls-1p .touch-btn-1p-main {
  width: auto !important; min-width: 44px !important; max-width: 120px !important;
  height: 42px !important; min-height: 42px !important; max-height:44px !important;
  flex: 1 1 88px !important; border-radius: 11px !important; font-size: 0.65em !important;
  padding: 0 6px !important; border-width:1.2px !important;
}
body.landscape-compact .touch-controls-1p .touch-btn-1p-main span:first-child { font-size:10px !important; }
body.landscape-compact .touch-controls-1p .touch-btn-1p-main span:last-child { font-size:7px !important; }
body.landscape-compact .touch-controls-1p .touch-btn-1p-emergency-wrap { width:48px !important; flex:0 0 48px !important; }
body.landscape-compact .touch-controls-1p .touch-btn-1p-emergency { width:40px !important; height:40px !important; min-width:40px !important; min-height:40px !important; border-radius:10px !important; }
body.landscape-compact .touch-controls-2p-landscape { top: 32px !important; bottom: 48px !important; }
body.landscape-compact .touch-controls-2p-landscape-side { width: 62px !important; }
body.landscape-compact .touch-controls-2p-landscape-side .touch-btn-2p-landscape { height: 38px !important; min-height:36px !important; max-height:40px !important; border-radius:10px !important; font-size:0.6em !important; }
body.landscape-compact .touch-controls-2p-landscape-side .touch-btn-2p-landscape-emergency { height:30px !important; min-height:30px !important; border-radius:8px !important; }
/* Tablet portrait (768-1024) */
@media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
  .touch-controls-1p { height: 118px !important; max-width: 560px; left:50% !important; right:auto !important; transform:translateX(-50%); }
  .touch-controls-1p .touch-btn-1p-main { max-width: 180px !important; }
  .touch-controls-2p-vert-top, .touch-controls-2p-vert-bottom { height: 72px !important; }
}
/* Tablet landscape (768-1024 landscape) */
@media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
  .touch-controls-1p { height: 64px !important; max-width: 640px; left:50% !important; right:auto !important; transform:translateX(-50%); }
  .touch-controls-2p-landscape { top: 42px !important; bottom: 62px !important; }
  .touch-controls-2p-landscape-side { width: 84px !important; }
}
/* Desktop (>=1025) */
@media (min-width: 1025px) {
  .touch-controls-1p { max-width: 680px; left: 50% !important; transform: translateX(-50%); right: auto !important; height: 132px !important; }
  .touch-controls-2p-landscape-side { width: 108px !important; }
}
/* Ensure safe area for notched iPhones */
@supports (padding: max(0px)) {
  .touch-controls-1p { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  .touch-controls-2p-landscape-side:first-child { padding-left: max(4px, env(safe-area-inset-left)); }
  .touch-controls-2p-landscape-side:last-child { padding-right: max(4px, env(safe-area-inset-right)); }
}
/* HUD compact for landscape iPhone */
@media (orientation: landscape) and (max-height: 500px) {
  .hud-top-1p { padding: 4px 8px !important; }
  .hud-top-1p .hud-score { font-size: 18px !important; }
  .hud-top-1p .hud-beat { font-size: 14px !important; }
}
