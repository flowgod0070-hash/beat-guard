@keyframes rankingPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255,230,0,0.9), 0 0 60px rgba(255,157,0,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,230,0,1), 0 0 80px rgba(255,157,0,0.6); }

/* ===== Responsive base ===== */
html, body { margin:0; padding:0; overflow:hidden; overscroll-behavior:none; }
* { -webkit-tap-highlight-color: transparent; }

/* Default portrait touch controls */
.touch-controls-1p { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }

/* Phone portrait (<= 430px) - keep original but ensure not overflow */
@media (max-width: 430px) and (orientation: portrait) {
  .touch-controls-1p { height: 128px !important; gap:6px !important; padding:6px !important; padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important; }
  .touch-controls-1p .touch-btn-1p-main { border-radius: 18px !important; }
}

/* Small phone like SE */
@media (max-width: 375px) {
  .touch-controls-1p { height: 118px !important; }
}

/* Galaxy Fold, narrow */
@media (max-width: 320px) {
  .touch-controls-1p { height: 106px !important; gap:4px !important; }
  .touch-controls-1p .touch-btn-1p-main span:first-child { font-size: 16px !important; }
}

/* ===== iPhone landscape fix - IMPROVED TAP COMFORT =====
   iPhone landscape = width > height and height <= 500
   Previously 42px / gap 6px was too cramped. Now 68x56, gap 14px, padding 8px 18px, height 74px
*/
@media (orientation: landscape) and (max-height: 500px) {
  .touch-controls-1p {
    height: 74px !important;
    min-height: 74px !important;
    max-height: 82px !important;
    gap: 14px !important;
    padding: 8px 18px !important;
    padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important;
    background: linear-gradient(to top, rgba(0,0,0,0.38), rgba(0,0,0,0.08)) !important;
    align-items: center !important;
    justify-content: center !important;
    opacity: 0.98;
    backdrop-filter: blur(8px);
  }
  .touch-controls-1p .touch-btn-1p-main {
    width: auto !important;
    min-width: 68px !important;
    max-width: 160px !important;
    height: 56px !important;
    min-height: 56px !important;
    max-height: 60px !important;
    flex: 1 1 120px !important;
    border-radius: 14px !important;
    font-size: 0.8em !important;
    padding: 0 10px !important;
    border-width: 1.6px !important;
    box-shadow: 0 0 16px rgba(0,240,255,0.28) !important;
  }
  .touch-controls-1p .touch-btn-1p-main span:first-child { font-size: 12px !important; letter-spacing: 0.06em !important; line-height:1.1 !important; }
  .touch-controls-1p .touch-btn-1p-main span:last-child { font-size: 8px !important; margin-top: 2px !important; line-height:1 !important; opacity:0.7 !important; }
  .touch-controls-1p .touch-btn-1p-emergency-wrap { width: 68px !important; gap: 3px !important; flex: 0 0 68px !important; }
  .touch-controls-1p .touch-btn-1p-emergency {
    width: 56px !important;
    height: 56px !important;
    min-width: 56px !important;
    min-height: 56px !important;
    border-radius: 13px !important;
    box-shadow: 0 0 14px rgba(255,230,0,0.32) !important;
  }
  .touch-controls-1p .touch-btn-1p-emergency span:first-child { font-size: 9px !important; line-height:1.1 !important; }
  .touch-controls-1p .touch-btn-1p-emergency span:last-child { font-size: 7.5px !important; }

  .touch-controls-2p-vert-top, .touch-controls-2p-vert-bottom { display:none !important; }
  .touch-controls-2p-landscape { top: 36px !important; bottom: 74px !important; gap: 14px !important; }
  .touch-controls-2p-landscape-side { width: 78px !important; gap: 10px !important; padding: 6px 8px !important; }
  .touch-controls-2p-landscape-side .touch-btn-2p-landscape {
    min-height: 52px !important;
    height: 56px !important;
    max-height: 58px !important;
    width: 100% !important;
    border-radius: 13px !important;
    font-size: 0.75em !important;
    border-width: 1.5px !important;
    padding: 0 4px !important;
  }

/* iPhone 14 Pro Max / 15 Pro Max landscape - slightly taller but still comfortable */
